plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

// 本地端到端自测用的可选运行参数，不传就不生效：
//   -PrwQuickPlay=<存档目录名>  直接把客户端开进某个单人世界（--quickPlaySingleplayer）
//   -PrwSelfTest=true          打开模组内置自测（-Drewind.selftest=true）
def rewindQuickPlay = project.findProperty('rwQuickPlay')
def rewindSelfTest = project.findProperty('rwSelfTest')

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-neoforge-1.21.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neoforge_121_version

    runs {
        client {
            client()
            if (rewindQuickPlay) {
                programArgument '--quickPlaySingleplayer'
                programArgument rewindQuickPlay.toString()
            }
            if (rewindSelfTest) {
                systemProperty 'rewind.selftest', rewindSelfTest.toString()
            }
        }
        server {
            server()
            programArgument '--nogui'
            // 同一个 -PrwSelfTest=true：客户端跑单人世界的自测，专用服务器跑 RewindServerSelfTest
            if (rewindSelfTest) {
                systemProperty 'rewind.servertest', rewindSelfTest.toString()
            }
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        url = 'https://maven.sighs.cc/repository/maven-public/'
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    implementation project(':common')
    // dev 运行时：moddev 只把本 target 的 sourceSet 输出挂进 MOD_CLASSES，游戏类加载器实际用的是
    // legacy classpath（clientLegacyClasspath.txt，来自 additionalRuntimeClasspath）。common 不是独立 mod，
    // 所以必须显式挂进后者，否则 dev 下会 NoClassDefFoundError（发行 jar 里 common 的类本来就是打进去的）。
    additionalRuntimeClasspath project(':common')
    implementation 'com.sighs:ApricityUI-neoforge-1.21.1:1.2.5.4'
//    implementation "curse.maven:smart-key-prompts-1300195:7450380"
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: neoforge_121_minecraft_version,
            neoforge_version: neoforge_121_version,
            neoforge_version_range: neoforge_121_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // common 的资源已经通过 gradle/target-conventions/publish.gradle 里的
    // sourceSets.main.resources.srcDir 并进来了，这里只需要补它的 class，
    // 否则同一份共享资源会在 jar 里出现两次（Gradle 会直接报 duplicate）。
    from project(':common').sourceSets.main.output.classesDirs
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: file('../../gradle/target-conventions/publish.gradle')
