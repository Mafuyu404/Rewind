plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-neoforge-1.21.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = neoforge_121_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        url = 'https://maven.sighs.cc/repository/maven-public/'
    }
    maven {
        name = "Curse Maven"
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    implementation project(':common')
    // dev 运行时：moddev 只把本 target 的 sourceSet 输出挂进 MOD_CLASSES，游戏类加载器实际用的是
    // legacy classpath（clientLegacyClasspath.txt，来自 additionalRuntimeClasspath）。common 不是独立 mod，
    // 所以必须显式挂进后者，否则 dev 下会 NoClassDefFoundError（发行 jar 里 common 的类本来就是打进去的）。
    additionalRuntimeClasspath project(':common')
    implementation 'com.sighs:ApricityUI-neoforge-1.21.1:1.2.6'
//    implementation "curse.maven:smart-key-prompts-1300195:7450380"
}

tasks.named('processResources', ProcessResources).configure {
    // 元数据里有中文注释：不显式指定的话 expand 走平台默认字符集（Windows 中文环境是 GBK），
    // 会把 UTF-8 读坏、写出非法 UTF-8，加载器解析 TOML 时会直接失败。
    filteringCharset = 'UTF-8'
    def replaceProperties = [
            minecraft_version: neoforge_121_minecraft_version,
            neoforge_version: neoforge_121_version,
            neoforge_version_range: neoforge_121_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // common 的资源已经通过 gradle/target-conventions/publish.gradle 里的
    // sourceSets.main.resources.srcDir 并进来了，这里只需要补它的 class，
    // 否则同一份共享资源会在 jar 里出现两次（Gradle 会直接报 duplicate）。
    from project(':common').sourceSets.main.output.classesDirs
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: file('../../gradle/target-conventions/publish.gradle')
