neoforge_121_minecraft_version=1.21.1
neoforge_121_version=21.1.234
neoforge_121_version_range=[21.1,)

# The sighs maven host also publishes AAAA records that are unreachable on some networks, and
# Gradle then fails to resolve ApricityUI with "Connection reset". Forcing IPv4 avoids that, and
# the host is flaky enough that the repository requests need more retries than the defaults.
# Drop these lines if maven.sighs.cc is reliable for you.
org.gradle.jvmargs=-Xmx3G -Djava.net.preferIPv4Stack=true
systemProp.org.gradle.internal.repository.max.retries=10
systemProp.org.gradle.internal.repository.initial.backoff=1000
