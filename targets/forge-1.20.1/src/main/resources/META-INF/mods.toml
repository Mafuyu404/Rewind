modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "[${minecraft_version},1.20.2)"
ordering = "NONE"
side = "BOTH"

# 时间树界面（RewindTreeScreen）直接用 ApricityUI 的界面 API，只有客户端需要。
[[dependencies.${mod_id}]]
modId = "apricityui"
mandatory = true
versionRange = "[1.2.6,)"
ordering = "NONE"
side = "CLIENT"

