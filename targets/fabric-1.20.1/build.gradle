buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.10.5'
        classpath 'me.modmuss50:mod-publish-plugin:2.1.1'
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'java'
apply plugin: 'me.modmuss50.mod-publish-plugin'

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-fabric-1.20.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets.main.output.dir(
        project(':common').layout.buildDirectory.dir('classes/java/main'),
        builtBy: ':common:classes'
)

repositories {
    mavenCentral()
    // ApricityUI：时间树界面用的 HTML/JS 驱动界面库
    maven {
        url = 'https://maven.sighs.cc/repository/maven-public/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${fabric_minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // 界面库（客户端轮次才会用上；先挂着，免得界面类写完再补依赖）
    modImplementation "com.sighs:ApricityUI-fabric-1.20.1:1.2.6"
    implementation project(':common')
}

loom {
    runs {
        client {
        }
        server {
            programArgs '--nogui'
        }
    }
}

// AUI fabric 的 SPI provider bug 由 cc/sighs/mixin/AuiFabricAnnotationScanMixins 绕开（见该类注释），
// 这里不需要再动 loom 的 access widener 校验。

tasks.named('processResources', ProcessResources).configure {
    // 元数据里有中文注释：不显式指定的话 expand 走平台默认字符集（Windows 中文环境是 GBK），
    // 会把 UTF-8 读坏、写出非法 UTF-8，加载器解析 JSON 时会直接失败。
    filteringCharset = 'UTF-8'
    def replaceProperties = [
            minecraft_version: fabric_minecraft_version,
            fabric_loader_version: fabric_loader_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

apply from: file('../../gradle/target-conventions/publish.gradle')
