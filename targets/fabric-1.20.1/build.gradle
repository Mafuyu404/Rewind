buildscript {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.fabricmc:fabric-loom:1.10.5'
        classpath 'me.modmuss50:mod-publish-plugin:2.1.1'
    }
}

apply plugin: 'fabric-loom'
apply plugin: 'java'
apply plugin: 'me.modmuss50.mod-publish-plugin'

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-fabric-1.20.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

sourceSets.main.output.dir(
        project(':common').layout.buildDirectory.dir('classes/java/main'),
        builtBy: ':common:classes'
)

repositories {
    mavenCentral()
    // ApricityUI：时间树界面用的 HTML/JS 驱动界面库
    maven {
        url = 'https://maven.sighs.cc/repository/maven-public/'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${fabric_minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    // 界面库（客户端轮次才会用上；先挂着，免得界面类写完再补依赖）
    modImplementation "com.sighs:ApricityUI-fabric-1.20.1:1.2.4"
    implementation project(':common')
}

// 本地端到端自测用的可选运行参数，不传就不生效（和主版本 neoforge-1.21.1 的两条一一对应）：
//   -PrwQuickPlay=<存档目录名>  直接把客户端开进某个单人世界（--quickPlaySingleplayer）
//   -PrwSelfTest=true          打开模组内置自测（client 设 -Drewind.selftest=true，
//                              server 设 -Drewind.servertest=true）
def rewindQuickPlay = project.findProperty('rwQuickPlay')
def rewindSelfTest = project.findProperty('rwSelfTest')

loom {
    runs {
        client {
            if (rewindQuickPlay) {
                programArgs '--quickPlaySingleplayer', rewindQuickPlay.toString()
            }
            if (rewindSelfTest) {
                vmArg "-Drewind.selftest=${rewindSelfTest}"
            }
        }
        server {
            // 同一个 -PrwSelfTest=true：客户端跑单人世界的自测，专用服务器跑 RewindServerSelfTest
            if (rewindSelfTest) {
                vmArg "-Drewind.servertest=${rewindSelfTest}"
            }
        }
    }
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: fabric_minecraft_version,
            fabric_loader_version: fabric_loader_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

apply from: file('../../gradle/target-conventions/publish.gradle')
