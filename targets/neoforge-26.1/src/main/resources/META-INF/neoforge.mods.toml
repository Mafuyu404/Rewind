modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

[[mixins]]
config = "rewind.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},26.2)"
ordering = "NONE"
side = "BOTH"

# 时间树界面（RewindTreeScreen）直接用 ApricityUI 的界面 API，只有客户端需要。
[[dependencies.${mod_id}]]
modId = "apricityui"
type = "required"
versionRange = "[1.2.6,)"
ordering = "NONE"
side = "CLIENT"

