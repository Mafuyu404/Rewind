plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

def properties = new Properties()
file('../../gradle.properties').withInputStream { properties.load(it) }
file('gradle.properties').withInputStream { properties.load(it) }
properties.each { key, value -> ext.set(key.toString(), value.toString()) }

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-neoforge-26.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

neoForge {
    version = neoforge_261_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven {
        url = 'https://maven.sighs.cc/repository/maven-public/'
    }
}

dependencies {
    implementation project(':common')
    // 主版本（neoforge-1.21.1）里还有一句 `additionalRuntimeClasspath project(':common')`：那边的
    // dev 运行走 FML 的 legacy classpath，common 不是独立 mod，不显式挂进去就会 NoClassDefFoundError。
    // 26.1 的 ModDevGradle 已经没有这条 classpath 了（VersionCapabilities.legacyClasspath() 为 false，
    // 声明这个配置会直接报 "there is no additional classpath anymore for Minecraft 26.1.2"），
    // dev 运行直接用标准 runtimeClasspath，所以 `implementation project(':common')` 就是全部所需。
    implementation 'com.sighs:ApricityUI-neoforge-26.1:1.2.7'
}

tasks.named('processResources', ProcessResources).configure {
    // 元数据里有中文注释：不显式指定的话 expand 走平台默认字符集（Windows 中文环境是 GBK），
    // 会把 UTF-8 读坏、写出非法 UTF-8，加载器解析 TOML 时会直接失败。
    filteringCharset = 'UTF-8'
    def replaceProperties = [
            minecraft_version: neoforge_261_minecraft_version,
            neoforge_version: neoforge_261_version,
            neoforge_version_range: neoforge_261_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // common 的资源已经通过 gradle/target-conventions/publish.gradle 里的
    // sourceSets.main.resources.srcDir 并进来了，这里只需要补它的 class，
    // 否则同一份共享资源会在 jar 里出现两次（Gradle 会直接报 duplicate）。
    from project(':common').sourceSets.main.output.classesDirs
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

apply from: file('../../gradle/target-conventions/publish.gradle')
